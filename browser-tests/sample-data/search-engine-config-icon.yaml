    collections:
      search-engine-config-icon:
        permissions: {}
        data:
          sort: -last_modified
          schema:
            type: object
            title: Search Engine Icons Schema
            required:
            - engineIdentifierPrefixes
            - imageSize
            properties:
              imageSize:
                type: number
                title: Image Size
                description: The image size in pixels. May be used to choose the most appropriate image for the display.
              engineIdentifiers:
                type: array
                items:
                  type: string
                  pattern: ^[a-zA-Z0-9-_]*$
                title: Engine Identifiers
                description: An array of search engine identifiers that the attached icon is for. This is in addition to the list in engineIdentifierPrefixes.
              filter_expression:
                type: string
                title: Filter Expression
                pattern: ^[a-zA-Z0-9-_=!"{} .]*$
                description: A JEXL to filter records
              engineIdentifierPrefixes:
                type: array
                items:
                  type: string
                  pattern: ^[a-zA-Z0-9-_]*$
                title: Engine Identifier Prefixes
                description: An array of search engine identifier prefixes that the attached icon is for. This is in addition to the list in engineIdentifiers.
            description: This schema contains the structure of data for search engine icons which built from search-engine-config-v2. The associated remote settings collection is search-config-icons.
          uiSchema:
            ui:order:
            - engineIdentifierPrefixes
            - engineIdentifiers
            - imageSize
            - filter_expression
          attachment:
            enabled: true
            required: true
          cache_expires: 0
          displayFields:
          - engineIdentifierPrefixes
          - engineIdentifiers
          - imageSize
          - filter_expression
          id: search-engine-config-icon
