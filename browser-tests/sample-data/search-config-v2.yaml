buckets:
  main-workspace:
    collections:
      search-config-v2:
        permissions: {}
        data:
          sort: -last_modified
          schema:
            type: object
            allOf:
            - if:
                properties:
                  recordType:
                    const: engine
              then:
                required:
                - recordType
                - identifier
                - base
                - variants
                properties:
                  base:
                    type: object
                    title: Base Details
                    required:
                    - name
                    - urls
                    - classification
                    properties:
                      name:
                        type: string
                        title: Name
                        maxLength: 100
                        description: The user visible name for the search engine.
                      urls:
                        $ref: '#/definitions/urls'
                      aliases:
                        type: array
                        items:
                          type: string
                          pattern: ^[a-z\xa1-\uffff]*$
                        title: Aliases
                        description: "An array of aliases that the user can use to search with this engine. The\naliases will be prefix by '@' on desktop and potentially other platforms."
                        uniqueItems: true
                      charset:
                        type: string
                        title: Character Set
                        pattern: ^[a-zA-Z0-9-]*$
                        description: The character set this engine uses for queries. Defaults to 'UTF=8' if not set.
                      partnerCode:
                        $ref: '#/definitions/partnerCode'
                      classification:
                        enum:
                        - general
                        - unknown
                        type: string
                        title: Classification
                        description: "The classification of search engine according to the main search types (e.g.\ngeneral, shopping, travel, dictionary). Currently, only marking as a general\nsearch engine is supported."
                    description: Base details for the engine.
                  notes:
                    type: string
                    title: Notes
                    pattern: ^[a-zA-Z0-9-_.() ]*$
                    description: "A short notes section used to potentially aid identification of this section for\nhumans. Not intended for to be read by the application."
                  variants:
                    type: array
                    items:
                      type: object
                      required:
                      - environment
                      properties:
                        urls:
                          $ref: '#/definitions/urls'
                        optional:
                          type: boolean
                          title: Optional
                          description: "This search engine is presented as an option that the user may enable. It is not\nincluded in the initial list of search engines. If not specified, defaults to\nfalse."
                        isNewUntil:
                          $ref: '#/definitions/isNewUntil'
                        environment:
                          $ref: '#/definitions/environment'
                        partnerCode:
                          $ref: '#/definitions/partnerCode'
                        subVariants:
                          type: array
                          items:
                            type: object
                            required:
                            - environment
                            properties:
                              urls:
                                $ref: '#/definitions/urls'
                              optional:
                                type: boolean
                                title: Optional
                                description: "This search engine is presented as an option that the user may enable. It is not\nincluded in the initial list of search engines. If not specified, defaults to\nfalse."
                              isNewUntil:
                                $ref: '#/definitions/isNewUntil'
                              environment:
                                $ref: '#/definitions/environment'
                              partnerCode:
                                $ref: '#/definitions/partnerCode'
                              telemetrySuffix:
                                type: string
                                title: Telemetry Suffix
                                pattern: ^[a-zA-Z0-9-]*$
                                description: "Suffix that is appended to the search engine identifier following a dash, i.e.\n`<identifier>-<suffix>`. There should always be a suffix supplied if the partner\ncode is different for a reason other than being on a different platform."
                          title: Subvariants
                          description: "This section describes subvariations of this search engine that may occur\ndepending on the user's environment. The last subvariant that matches the user's\nenvironment will be applied to the engine."
                        telemetrySuffix:
                          type: string
                          title: Telemetry Suffix
                          pattern: ^[a-zA-Z0-9-]*$
                          description: "Suffix that is appended to the search engine identifier following a dash, i.e.\n`<identifier>-<suffix>`. There should always be a suffix supplied if the partner\ncode is different for a reason other than being on a different platform."
                    title: Variants
                    description: "This section describes variations of this search engine that may occur depending\non the user's environment. The last variant that matches the user's environment\nwill be applied to the engine, subvariants may also be applied."
                  identifier:
                    type: string
                    title: Identifier
                    pattern: ^[a-zA-Z0-9-_]*$
                    description: "The identifier of the search engine. This is used as an internal identifier,\ne.g. for saving the user's settings for the engine. It is also used to form the\nbase telemetry id and may be extended by telemetrySuffix."
                  recordType:
                    $ref: '#/definitions/recordType'
            - if:
                properties:
                  recordType:
                    const: defaultEngines
              then:
                required:
                - recordType
                - globalDefault
                properties:
                  recordType:
                    $ref: '#/definitions/recordType'
                  globalDefault:
                    type: string
                    title: Global Default
                    pattern: ^[a-zA-Z0-9-_]*$
                    description: "The identifier of the engine that will be used as the application default if no\nother engines are specified as default."
                  specificDefaults:
                    type: array
                    items:
                      type: object
                      oneOf:
                      - required:
                        - environment
                        - default
                      - required:
                        - environment
                        - defaultPrivate
                      - required:
                        - environment
                        - default
                        - defaultPrivate
                      properties:
                        default:
                          type: string
                          title: Default
                          pattern: ^[a-zA-Z0-9-_]*\*?$
                          description: "The identifier of the engine that will be used as the application default for\nthe associated environment. If the entry is suffixed with a star, matching is\napplied on a \"starts with\" basis."
                        environment:
                          $ref: '#/definitions/environment'
                        defaultPrivate:
                          type: string
                          title: Default - Private Mode
                          pattern: ^[a-zA-Z0-9-_]*\*?$
                          description: "The identifier of the engine that will be used as the application default in\nprivate mode for the associated environment. If the entry is suffixed with a\nstar, matching is applied on a \"starts with\" basis."
                    title: Filters
                    description: "The specific environment filters to set a different default engine. The array is\nordered, when multiple entries match on environments, the later entry will\noverride earlier entries."
                  globalDefaultPrivate:
                    type: string
                    title: Global Default - Private Mode
                    pattern: ^[a-zA-Z0-9-_]*$
                    description: "The identifier of the engine that will be used as the application default in\nprivate mode if no other engines are specified as default."
            - if:
                properties:
                  recordType:
                    const: engineOrders
              then:
                required:
                - recordType
                - orders
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      required:
                      - environment
                      properties:
                        order:
                          type: array
                          items:
                            type: string
                            pattern: ^[a-zA-Z0-9-_]*\*?$
                          title: Engine Order
                          description: "The order of the engines for the associated environment. If engines are present\nfor the user but not included in this list, they will follow after the ones in\nthis list in alphabetical order. If an individual entry is suffixed with a star,\nmatching is applied on a \"starts with\" basis."
                        environment:
                          $ref: '#/definitions/environment'
                    title: Orders
                    description: "When a user's instance matches the defined environments, the associated engine\norder will be applied. The array is ordered, when multiple entries match on\nenvironments, the later entry will override earlier entries."
                  recordType:
                    $ref: '#/definitions/recordType'
            - if:
                properties:
                  recordType:
                    const: availableLocales
              then:
                required:
                - recordType
                - locales
                properties:
                  locales:
                    type: array
                    items:
                      type: string
                      pattern: ^(?:[a-z]{2,3}(-[a-zA-Z]{2,})?(?:-macos)?|default)$
                      minLength: 2
                    title: Locales
                    description: "All locales listed in the 'locales' field of each engine record. This is used so\nthat we can choose the correct fallback locales on mobile which generally\nsupplies locales of the form ab-CD. This record is an optimisation so that we\ncan avoid parsing the configuration each time for all the locales."
                    uniqueItems: true
                  recordType:
                    $ref: '#/definitions/recordType'
            title: Application Provided Search Engines Schema
            properties:
              recordType:
                $ref: '#/definitions/recordType'
            definitions:
              url:
                type: object
                properties:
                  base:
                    type: string
                    title: Base
                    description: "The PrePath and FilePath of the URL. May include variables for engines which\nhave a variable FilePath, e.g. {searchTerm} for when a search term is within the\npath of the url."
                  method:
                    enum:
                    - GET
                    - POST
                    type: string
                    title: Method
                    pattern: ^(GET|POST)$
                    description: The HTTP method to use to send the request. If not specified, defaults to GET.
                  params:
                    type: array
                    items:
                      type: object
                      oneOf:
                      - required:
                        - name
                        - value
                      - required:
                        - name
                        - enterpriseValue
                      - required:
                        - name
                        - experimentConfig
                      title: Parameter
                      properties:
                        name:
                          type: string
                          title: Name
                          pattern: ^[a-zA-Z0-9-_]*$
                          description: The parameter name
                        value:
                          type: string
                          title: Value
                          pattern: ^[a-zA-Z0-9-_{}]*$
                          description: "The parameter value, this may be a static value, or additionally contain a\nparameter replacement, e.g. {inputEncoding}. For the partner code parameter,\nthis field should be {partnerCode}."
                        enterpriseValue:
                          type: string
                          title: Value
                          pattern: ^[a-zA-Z0-9-_{}]*$
                          description: "Same as value but only used if Services.polices.isEnterprise is true. Overrides\nother parameters of the same name."
                        experimentConfig:
                          type: string
                          title: Experiment Configuration
                          pattern: ^[a-zA-Z0-9-_]*$
                          description: "The value for the parameter will be derived from the equivalent experiment\nconfiguration value. If not experiment is present, this parameter will not be\nincluded in the final url."
                    title: Parameters
                    description: The parameters for this URL.
                  isNewUntil:
                    $ref: '#/definitions/isNewUntil'
                  displayNameMap:
                    type: object
                    title: Name
                    description: "A map from locale codes to display names of the URL. This is useful if the URL\ncorresponds to a brand name distinct from the engine's brand name. Since brand\nnames can be localized, this is a map rather than a URL. The client will fall\nback to the special locale code 'default' when its locale is not present in the\nmap."
                  searchTermParamName:
                    type: string
                    title: Search Term Parameter Name
                    pattern: ^[a-zA-Z0-9-_]*$
                    description: "The name of the query parameter for the search term. Automatically appended to\nthe end of the query. This may be skipped if `{searchTerm}` is included in the\nbase."
                  acceptedContentTypes:
                    type: array
                    items:
                      type: string
                    title: Accepted content types
                    description: "If this URL performs searches only for certain MIME types, they should be listed\nhere. If `None`, it's assumed the content type is text or not relevant. This\nfield is intended to be used for URLs like visual search, which might support\ncertain image types and not others. Consumers can use it to determine whether\nsearch UI corresponding to the URL should be shown to the user in a given\ncontext."
                    uniqueItems: true
                  excludePartnerCodeFromTelemetry:
                    type: boolean
                    title: Exclude partner code from telemetry
                    description: "Whether the engine's partner code should be excluded from telemetry when this\nURL is visited."
              urls:
                type: object
                title: URLs
                properties:
                  search:
                    $ref: '#/definitions/url'
                    title: Search URL
                    description: The URL to use for searches
                  trending:
                    $ref: '#/definitions/url'
                    title: Trending Suggestions URL
                    description: The URL to use for tending suggestions
                  searchForm:
                    $ref: '#/definitions/url'
                    title: SearchForm URL
                    description: The URL of the search engine homepage
                  suggestions:
                    $ref: '#/definitions/url'
                    title: Suggestions URL
                    description: The URL to use for suggestions
                  visualSearch:
                    $ref: '#/definitions/url'
                    title: Visual search URL
                    description: The URL to use for visual searches
                description: The URLs associated with the search engine.
              isNewUntil:
                type: string
                title: Is New Until
                format: date
                description: "Indicates the date until which the engine variant, subvariant, or URL is\nconsidered new (format: YYYY-MM-DD)."
              recordType:
                enum:
                - engine
                - defaultEngines
                - engineOrders
                - availableLocales
                title: Record Type
                description: The type of details that this record contains.
              environment:
                type: object
                title: Environment
                properties:
                  locales:
                    type: array
                    items:
                      type: string
                      pattern: ^([a-z]{2,3}(-[a-zA-Z]{2,})?(-macos)?|default)$
                      minLength: 2
                    title: Locales
                    description: "An array of locales that this section applies to. 'default' will apply to\nsituations where we have not been able to detect the user's locale."
                    uniqueItems: true
                  regions:
                    type: array
                    items:
                      type: string
                      pattern: ^([a-z][a-z]|default)$
                      maxLength: 7
                      minLength: 2
                    title: Regions
                    description: "An array of regions that this section applies to. 'default' will apply to\nsituations where we have not been able to detect the user's region."
                    uniqueItems: true
                  channels:
                    type: array
                    items:
                      enum:
                      - default
                      - nightly
                      - aurora
                      - beta
                      - release
                      - esr
                      type: string
                      pattern: ^[a-z]{0,100}$
                    title: Release Channels
                    description: "An array of release channels that this section applies to (not set =\neverywhere)."
                    uniqueItems: true
                  deviceType:
                    type: array
                    items:
                      enum:
                      - smartphone
                      - tablet
                      type: string
                      pattern: ^[a-z-]{0,100}$
                    title: Device Type
                    description: "The device type(s) this section applies to. On desktop when this property is\nspecified and non-empty, the associated section will be ignored."
                    uniqueItems: true
                  experiment:
                    type: string
                    title: Experiment
                    pattern: ^[a-zA-Z0-9-]{0,100}$
                    description: The experiment that this section applies to.
                  maxVersion:
                    type: string
                    title: Maximum Version
                    pattern: ^[0-9a-z.]{0,20}$
                    description: The maximum application version this section applies to (less-than comparison).
                  minVersion:
                    type: string
                    title: Minimum Version
                    pattern: ^[0-9a-z.]{0,20}$
                    description: The minimum application version this section applies to.
                  applications:
                    type: array
                    items:
                      enum:
                      - firefox
                      - firefox-android
                      - firefox-ios
                      - focus-android
                      - focus-ios
                      type: string
                      pattern: ^[a-z-]{0,100}$
                    title: Application Identifiers
                    description: "The application(s) this section applies to (default/not specified is\neverywhere). `firefox` relates to Firefox Desktop."
                    uniqueItems: true
                  distributions:
                    type: array
                    items:
                      type: string
                      pattern: ^[a-zA-Z0-9.-]{0,100}$
                    title: Distributions
                    description: An array of distribution identifiers that this applies to.
                    uniqueItems: true
                  excludedLocales:
                    type: array
                    items:
                      type: string
                      pattern: ^([a-z]{2,3}(-[a-zA-Z]{2,})?(-macos)?|default)$
                      minLength: 2
                    title: Excluded Locales
                    description: "An array of locales that this section should be excluded from. 'default' will\napply to situations where we have not been able to detect the user's locale."
                    uniqueItems: true
                  excludedRegions:
                    type: array
                    items:
                      type: string
                      pattern: ^([a-z]{2,3}|default)$
                      maxLength: 7
                      minLength: 2
                    title: Excluded Regions
                    description: "An array of regions that this section should be excluded from. 'default' will\napply to situations where we have not been able to detect the user's region."
                    uniqueItems: true
                  allRegionsAndLocales:
                    type: boolean
                    title: All Regions and Locales
                    description: "Indicates that this section applies to all regions and locales. May be modified\nby excludedRegions/excludedLocales."
                  excludedDistributions:
                    type: array
                    items:
                      type: string
                      pattern: ^[a-zA-Z0-9.-]{0,100}$
                    title: Excluded Distributions
                    description: An array of distribution identifiers that this does not apply to.
                    uniqueItems: true
                description: "Specifies details of possible user environments that the engine or variant\napplies to"
              partnerCode:
                type: string
                title: Partner Code
                pattern: ^[a-zA-Z0-9-_.]*$
                description: "The partner code for the engine or variant. This will be inserted into\nparameters which include '{partnerCode}'"
            description: "This schema contains the details to build application provided search engines\nshipped in some Mozilla products. The associated remote settings collection is\nsearch-config-v2. Note: the top-level properties section is only required to\nsatisfy remoteSettings. The allOf section provides the full details of the\ndifferent record types."
          created: '2023-12-15'
          tickets:
          - https://bugzilla.mozilla.org/show_bug.cgi?id=1870244
          uiSchema:
            ui:order:
            - recordType
          attachment:
            enabled: false
            required: false
          description: Search engine configuration v2 (cross-platform)
          cache_expires: 0
          displayFields:
          - recordType
          - identifier
          id: search-config-v2
        records:
