version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  apt_packages:
    # for bin/structurizr-export.sh
    - openjdk-21-jre-headless
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      - uv sync --group docs --no-install-project
    pre_build:
      - bin/structurizr-export.sh
