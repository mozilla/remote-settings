version: 2
updates:
- package-ecosystem: uv
  directories:
    - "/"
    - "/cronjobs"
    - "/git-reader"
    - "/browser-tests"
  schedule:
    interval: weekly
    day: sunday
    timezone: UCT
  cooldown:
    # Let others try before offering update PRs (does not affect security)
    default-days: 14
  allow:
    - dependency-type: "all"
  groups:
    google-cloud:
      patterns: ["google*", "grpcio*", "proto*"]
      update-types: ["minor", "patch"]
    production-dependencies:
      dependency-type: "production"
      update-types: ["minor", "patch"]
    development-dependencies:
      dependency-type: "development"
      update-types: ["major", "minor", "patch"]
    security:
      applies-to: security-updates
      patterns: ["*"]
  open-pull-requests-limit: 99
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
    timezone: UCT
  open-pull-requests-limit: 99
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 99
  groups:
    all-dependencies:
      update-types: ["major", "minor", "patch"]
