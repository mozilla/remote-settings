<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Stopwatch mark in Fastly red, for CDN elements in the Structurizr workspace -->
  <g fill="#FF282D">
    <!-- crown -->
    <rect x="106" y="14" width="44" height="18" rx="5"/>
    <rect x="118" y="28" width="20" height="22"/>
    <!-- side button -->
    <rect x="186" y="50" width="18" height="30" rx="5" transform="rotate(45 195 65)"/>
  </g>
  <!-- case -->
  <circle cx="128" cy="146" r="90" fill="none" stroke="#FF282D" stroke-width="22"/>
  <!-- ticks -->
  <g stroke="#FF282D" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="80" x2="128" y2="92"/>
    <line x1="194" y1="146" x2="182" y2="146"/>
    <line x1="128" y1="212" x2="128" y2="200"/>
    <line x1="62" y1="146" x2="74" y2="146"/>
  </g>
  <!-- needle -->
  <line x1="128" y1="146" x2="166" y2="104" stroke="#FF282D" stroke-width="12" stroke-linecap="round"/>
  <circle cx="128" cy="146" r="14" fill="#FF282D"/>
</svg>
